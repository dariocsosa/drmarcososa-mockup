<title>Guion Masterclass 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600&display=swap">
<style>
/* Guía de pantalla para grabar una clase: cuenta regresiva por bloque, puntos grandes, diapositivas de Marco a la vista */
:root {
  --verde-profundo: #173F33;
  --verde-bosque: #1F5142;
  --verde-salvia: #9BAFA4;
  --verde-claro: #E4EDE7;
  --crema: #F7F1E5;
  --crema-claro: #FFF9EE;
  --mostaza: #E4AA18;
  --tinta: #15261F;
  --granate: #8C4A41;
  --bg: var(--crema);
  --card: var(--crema-claro);
  --fg: var(--tinta);
  --fg2: #43554C;
  --head: var(--verde-profundo);
  --linea: #D5D9CC;
  --btn: var(--verde-bosque);
  --btn-fg: #FFF9EE;
  --activo: var(--verde-claro);
  --ok-bg: var(--verde-bosque);
  --ok-fg: #FFF9EE;
  --alerta-bg: var(--mostaza);
  --alerta-fg: #173F33;
  --pasado-bg: var(--granate);
  --pasado-fg: #FFF9EE;
  --aviso: #8C4A41;
  --display: "Fraunces", Georgia, serif;
  --texto: "Archivo", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1713; --card: #172821; --fg: #F1EFE3; --fg2: #B3C1B8; --head: #E4EDE7; --linea: #2B3F36;
    --activo: #1F3A30; --btn: #9BAFA4; --btn-fg: #0E1713; --ok-bg: #2A5E4D; --pasado-bg: #B5655A; --aviso: #D58E82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1713; --card: #172821; --fg: #F1EFE3; --fg2: #B3C1B8; --head: #E4EDE7; --linea: #2B3F36;
  --activo: #1F3A30; --btn: #9BAFA4; --btn-fg: #0E1713; --ok-bg: #2A5E4D; --pasado-bg: #B5655A; --aviso: #D58E82;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--texto); font-size: 17px; line-height: 1.45; margin: 0;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 140px;
}
.wrap { max-width: 920px; margin: 0 auto; }
h2, h3 { font-family: var(--display); color: var(--head); text-wrap: balance; margin: 0; }
p { margin: 0; }
button, select {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; border: 1px solid var(--btn);
  background: var(--btn); color: var(--btn-fg); padding: 10px 18px; font-size: 1rem;
}
button.sec { background: transparent; color: var(--head); border-color: var(--verde-salvia); }
button:focus-visible, select:focus-visible { outline: 3px solid var(--mostaza); outline-offset: 2px; }
select { background: var(--card); color: var(--head); border-color: var(--verde-salvia); padding: 8px 12px; max-width: 100%; }

/* Cabecera fija */
.cab { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding-top: 10px; border-bottom: 1px solid var(--linea); }
.cab-top { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.cab-top select { min-width: 0; width: 100%; }
.tabs { display: flex; gap: 6px; }
.tabs button { padding: 6px 12px; font-size: .85rem; }
.tabs button[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); }
.cab-fila { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: end; }
.bloque-nombre { min-width: 0; }
.bloque-nombre small { display: block; color: var(--fg2); font-size: .85rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.bloque-nombre b { display: block; font-family: var(--display); font-size: clamp(1.25rem, 1rem + 1.4vw, 1.9rem); color: var(--head); line-height: 1.1; }
.cuenta {
  font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1;
  font-size: clamp(3.2rem, 2rem + 8vw, 6.4rem); padding: 4px 18px 8px; border-radius: 14px;
  background: var(--ok-bg); color: var(--ok-fg); text-align: center; min-width: 3.9em;
}
.cuenta.alerta { background: var(--alerta-bg); color: var(--alerta-fg); }
.cuenta.pasado { background: var(--pasado-bg); color: var(--pasado-fg); }
.cuenta.espera { background: var(--card); color: var(--head); border: 2px dashed var(--verde-salvia); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 8px 0; font-size: .95rem; color: var(--fg2); }
.chip { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; background: var(--verde-claro); color: var(--verde-profundo); }
.chip.dia { background: var(--mostaza); color: var(--verde-profundo); }
.ritmo { font-weight: 700; }
.ritmo.atras { color: var(--aviso); }
.ritmo.ade { color: var(--verde-bosque); }
:root[data-theme="dark"] .ritmo.ade { color: #9BAFA4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ritmo.ade { color: #9BAFA4; } }
.barra { display: flex; gap: 3px; height: 10px; margin-bottom: 10px; }
.seg { position: relative; background: var(--linea); border-radius: 3px; overflow: hidden; }
.seg i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--verde-bosque); }
.seg.actual { outline: 2px solid var(--mostaza); outline-offset: 1px; }

/* Escenario */
.vista { display: none; padding-top: 18px; }
.vista.on { display: block; }
.puntos { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.punto {
  display: grid; grid-template-columns: 1.6rem 1fr; gap: 12px; align-items: start; width: 100%; text-align: left;
  background: var(--card); color: var(--fg); border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px;
  font-weight: 500; font-size: clamp(1.15rem, 1rem + 0.9vw, 1.55rem); line-height: 1.35;
}
.punto::before { content: ""; width: 1.4rem; height: 1.4rem; border: 2px solid var(--verde-salvia); border-radius: 50%; margin-top: .1rem; }
.punto[aria-pressed="true"] { opacity: .42; text-decoration: line-through; text-decoration-thickness: 1px; }
.punto[aria-pressed="true"]::before { background: var(--verde-bosque); border-color: var(--verde-bosque); box-shadow: inset 0 0 0 3px var(--card); }
.diapos { display: inline-flex; gap: 8px; align-items: baseline; margin-bottom: 12px; padding: 8px 14px; border-radius: 10px; background: color-mix(in srgb, var(--mostaza) 22%, var(--card)); border: 1px solid color-mix(in srgb, var(--mostaza) 55%, var(--linea)); }
.diapos span { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.diapos b { font-family: var(--display); font-size: 1.5rem; color: var(--head); }
.diapos.libro { background: var(--verde-claro); border-color: var(--verde-salvia); margin-right: 8px; }
.diapos.libro b { font-size: 1.05rem; font-family: var(--texto); font-weight: 600; }
:root[data-theme="dark"] .diapos.libro { background: var(--activo); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .diapos.libro { background: var(--activo); } }
.tablero { margin-top: 14px; padding: 14px 18px; border-left: 5px solid var(--mostaza); background: color-mix(in srgb, var(--mostaza) 15%, var(--card)); border-radius: 0 10px 10px 0; font-size: clamp(1.05rem, .95rem + .6vw, 1.3rem); font-weight: 500; }
.tablero small { display: block; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--fg2); margin-bottom: 2px; font-weight: 700; }
.ojo { margin-top: 22px; padding: 14px 18px; border: 1px dashed var(--aviso); border-radius: 12px; background: color-mix(in srgb, var(--aviso) 9%, var(--card)); }
.ojo h3 { font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--aviso); margin: 0 0 6px; font-family: var(--texto); font-weight: 700; }
.ojo ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: 1rem; }

/* Pie fijo */
.pie {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--linea);
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
.pie-in { max-width: 920px; margin: 0 auto; display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: stretch; }
.pie .sig { grid-column: 1 / -1; font-size: .9rem; color: var(--fg2); }
.pie .sig b { color: var(--head); }
#nxt { font-size: 1.15rem; padding: 14px 18px; }
#nxt:disabled, #prv:disabled { opacity: .4; cursor: default; }

/* Módulo completo y lista de módulos */
.lista { display: grid; gap: 10px; }
.fila { background: var(--card); border: 1px solid var(--linea); border-radius: 12px; padding: 12px 16px; }
.fila.act { background: var(--activo); border-color: var(--verde-bosque); }
.fila-top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.fila-top b { font-family: var(--display); color: var(--head); font-size: 1.1rem; }
.fila .t { font-variant-numeric: tabular-nums; color: var(--fg2); font-size: .9rem; }
.fila ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 3px; font-size: .95rem; }
.fila h4 { margin: 10px 0 2px; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.mod-btn { width: 100%; text-align: left; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--card); color: var(--fg); border: 1px solid var(--linea); border-radius: 12px; padding: 12px 16px; font-weight: 500; }
.mod-btn.act { background: var(--activo); border-color: var(--verde-bosque); }
.mod-btn .id { font-family: var(--display); font-size: 1.3rem; font-weight: 700; color: var(--head); min-width: 2.2em; }
.mod-btn .tt { min-width: 0; }
.mod-btn .min { font-variant-numeric: tabular-nums; color: var(--fg2); font-size: .9rem; white-space: nowrap; }
.nota { margin: 0 0 14px; color: var(--fg2); font-size: .95rem; }
/* Pantalla de clave */
.candado { display: none; min-height: 70vh; align-items: center; justify-content: center; }
body.bloqueado .candado { display: flex; }
body.bloqueado .cab, body.bloqueado .wrap, body.bloqueado .pie { display: none; }
.candado-in { width: min(100%, 420px); display: grid; gap: 10px; background: var(--card); border: 1px solid var(--linea); border-radius: 14px; padding: 24px; }
.candado-in p { color: var(--fg2); font-size: .95rem; }
.candado-in label { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.candado-in input { font: inherit; font-size: 1.1rem; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--verde-salvia); background: var(--bg); color: var(--fg); min-width: 0; }
.candado-in input:focus-visible { outline: 3px solid var(--mostaza); outline-offset: 2px; }
.candado-in .msg { color: var(--aviso); font-weight: 600; min-height: 1.3em; }
@media (max-width: 560px) { .cab-fila { grid-template-columns: 1fr; } .cuenta { justify-self: stretch; } .pie-in { grid-template-columns: 1fr 1fr; } #nxt { grid-column: 1 / -1; order: -1; } .cab-top { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .cuenta { transition: background .4s; } }
</style>

<main class="candado" id="candado">
  <form id="form-clave" class="candado-in">
    <h2>Guion Masterclass 2</h2>
    <p>Guía de pantalla para grabar las clases. Escribe la clave que te dieron para abrirla.</p>
    <label for="clave">Clave</label>
    <input id="clave" type="password" autocomplete="current-password" required>
    <button type="submit">Abrir la guía</button>
    <p class="msg" id="clave-msg" role="alert"></p>
  </form>
</main>

<div class="cab">
  <div class="wrap">
    <div class="cab-top">
      <select id="mod" aria-label="Módulo"></select>
      <div class="tabs" role="group" aria-label="Vista">
        <button type="button" class="sec" id="tab-escena" aria-pressed="true">En escena</button>
        <button type="button" class="sec" id="tab-guion" aria-pressed="false">Módulo</button>
        <button type="button" class="sec" id="tab-mods" aria-pressed="false">Todos</button>
      </div>
    </div>
    <div class="cab-fila">
      <div class="bloque-nombre"><small id="pos"></small><b id="nom"></b></div>
      <div class="cuenta espera" id="cta" aria-live="off">00:00</div>
    </div>
    <div class="meta">
      <span class="chip" id="chip"></span>
      <span>Módulo <b id="tot" class="cuadro">00:00</b> de <span id="dur">40:00</span></span>
      <span class="ritmo" id="ritmo"></span>
    </div>
    <div class="barra" id="barra"></div>
  </div>
</div>

<div class="wrap">
  <section class="vista on" id="v-escena"><div id="escena"></div></section>
  <section class="vista" id="v-guion"><div class="lista" id="lista"></div></section>
  <section class="vista" id="v-mods">
    <p class="nota">Toca un módulo para abrirlo. Las notas de cuidado de cada módulo están al final de «Módulo».</p>
    <div class="lista" id="mods"></div>
  </section>
</div>

<div class="pie">
  <div class="pie-in">
    <button type="button" class="sec" id="prv">◂ Anterior</button>
    <button type="button" class="sec" id="pau">Pausar</button>
    <button type="button" id="nxt">Empezar</button>
    <div class="sig" id="sig"></div>
  </div>
</div>

var $ = function (id) { return document.getElementById(id); };
function mmss(s) { var neg = s < 0; s = Math.floor(Math.abs(s)); return (neg ? '+' : '') + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

/* Un módulo se vuelve una lista de bloques con inicio y fin en segundos */
function armar(m) {
  var larga = m.minutos >= 40, C = larga ? 3 : 2, suma = 0;
  m.bloques.forEach(function (b) { suma += b.min; });
  var A = Math.max(1, m.minutos - suma - C);
  var seq = [{ n: 'Apertura', min: A, lineas: m.apertura || [], aper: true }];
  m.bloques.forEach(function (b) { seq.push({ n: b.titulo, min: b.min, diapos: b.diapos, bullets: b.bullets || [], tablero: b.tablero }); });
  seq.push({ n: 'Cierre', min: C, lineas: m.cierre || [], cierre: true });
  var t = 0;
  seq.forEach(function (b) { b.ini = t * 60; t += b.min; b.fin = t * 60; });
  return { seq: seq, total: t * 60, ojo: m.ojo || [] };
}

var idx = 0, M = null, S = null, KEYBASE = 'guia-' + CURSO.clave + '-';
function nuevoEstado() { return { running: false, started: false, inicio: 0, acum: 0, cur: 0, checks: {} }; }
function guardar() { try { localStorage.setItem(KEYBASE + MODULOS[idx].id, JSON.stringify(S)); } catch (e) {} try { localStorage.setItem(KEYBASE + 'ultimo', String(idx)); } catch (e) {} }
function cargar() { S = nuevoEstado(); try { var s = JSON.parse(localStorage.getItem(KEYBASE + MODULOS[idx].id) || 'null'); if (s && typeof s.cur === 'number') S = s; } catch (e) {} }
function total() { return S.acum + (S.running ? (Date.now() - S.inicio) / 1000 : 0); }

function abrir(i) {
  if (S && S.running) { S.acum = total(); S.running = false; guardar(); }
  idx = i; M = armar(MODULOS[idx]); cargar(); if (S.cur >= M.seq.length) S.cur = 0;
  $('mod').value = String(idx); $('dur').textContent = mmss(M.total);
  var bar = $('barra'); bar.innerHTML = '';
  M.seq.forEach(function (b) { var s = document.createElement('div'); s.className = 'seg'; s.style.flex = String(b.min); s.innerHTML = '<i></i>'; bar.appendChild(s); });
  pintar(); tick(); renderGuion(); renderMods();
}

function pintar() {
  var b = M.seq[S.cur], n = M.seq.length;
  $('pos').textContent = MODULOS[idx].id + ' · bloque ' + (S.cur + 1) + ' de ' + n;
  $('nom').textContent = b.n;
  $('chip').textContent = b.diapos ? 'Diapositivas ' + b.diapos : (b.aper ? 'Para abrir' : 'Para cerrar');
  $('chip').className = 'chip' + (b.diapos ? ' dia' : '');
  var segs = $('barra').children;
  for (var i = 0; i < segs.length; i++) segs[i].classList.toggle('actual', i === S.cur);
  var h = '';
  if (b.libro) h += '<div class="diapos libro"><span>Libro</span><b>' + esc(b.libro) + '</b></div> ';
  if (b.diapos) h += '<div class="diapos"><span>Diapositivas de Marco</span><b>' + esc(b.diapos) + '</b></div>';
  var items = b.lineas || b.bullets || [];
  h += '<ul class="puntos">';
  items.forEach(function (t, k) {
    var on = S.checks[S.cur + ':' + k] ? 'true' : 'false';
    h += '<li><button type="button" class="punto" data-k="' + k + '" aria-pressed="' + on + '">' + esc(t) + '</button></li>';
  });
  h += '</ul>';
  if (b.tablero) h += '<div class="tablero"><small>Al tablero</small>' + esc(b.tablero) + '</div>';
  if (S.cur === 0 && M.ojo.length) h += ojoHtml();
  $('escena').innerHTML = h;
  var sig = M.seq[S.cur + 1];
  $('sig').innerHTML = sig ? 'Sigue: <b>' + esc(sig.n) + '</b> · ' + sig.min + ' min' : 'Último bloque del módulo.';
  $('prv').disabled = S.cur === 0;
  $('nxt').textContent = !S.started ? 'Empezar' : (sig ? 'Siguiente bloque ▸' : 'Terminar módulo');
  $('pau').textContent = S.running ? 'Pausar' : 'Reanudar';
  $('pau').style.visibility = S.started ? 'visible' : 'hidden';
}
function ojoHtml() {
  var h = '<div class="ojo"><h3>Ojo en este módulo</h3><ul>';
  M.ojo.forEach(function (t) { h += '<li>' + esc(t) + '</li>'; });
  return h + '</ul></div>';
}

function tick() {
  var t = total(), b = M.seq[S.cur], rest = b.fin - t, c = $('cta');
  $('tot').textContent = mmss(Math.min(t, M.total + 3600));
  if (!S.started) { c.textContent = mmss(b.fin - b.ini); c.className = 'cuenta espera'; $('ritmo').textContent = ''; }
  else {
    c.textContent = mmss(rest);
    c.className = 'cuenta' + (rest < 0 ? ' pasado' : (rest <= 120 ? ' alerta' : ''));
    var r = $('ritmo');
    if (rest < 0) { r.textContent = 'Atrasado ' + mmss(-rest); r.className = 'ritmo atras'; }
    else if (t < b.ini - 5) { r.textContent = 'Adelantado ' + mmss(b.ini - t); r.className = 'ritmo ade'; }
    else { r.textContent = 'A tiempo'; r.className = 'ritmo'; }
  }
  var segs = $('barra').children;
  for (var i = 0; i < segs.length; i++) {
    var bb = M.seq[i], f = Math.max(0, Math.min(1, (t - bb.ini) / (bb.fin - bb.ini)));
    segs[i].firstChild.style.width = (f * 100) + '%';
  }
}
setInterval(function () { if (M) tick(); }, 500);

function pedirPantalla() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {} }
function sigBloque() {
  if (!S.started) { S.started = true; S.running = true; S.inicio = Date.now(); pedirPantalla(); }
  else if (S.cur < M.seq.length - 1) S.cur++;
  else { S.acum = total(); S.running = false; }
  guardar(); pintar(); tick(); renderGuion();
}
function antBloque() { if (S.cur > 0) { S.cur--; guardar(); pintar(); tick(); renderGuion(); } }
$('nxt').addEventListener('click', sigBloque);
$('prv').addEventListener('click', antBloque);
$('pau').addEventListener('click', function () {
  if (S.running) { S.acum = total(); S.running = false; } else { S.inicio = Date.now(); S.running = true; pedirPantalla(); }
  guardar(); pintar();
});
$('escena').addEventListener('click', function (e) {
  var p = e.target.closest('.punto'); if (!p) return;
  var k = S.cur + ':' + p.getAttribute('data-k'); S.checks[k] = !S.checks[k]; guardar();
  p.setAttribute('aria-pressed', S.checks[k] ? 'true' : 'false');
});
document.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') sigBloque();
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') antBloque();
});

function renderGuion() {
  var h = '';
  M.seq.forEach(function (b, i) {
    var items = b.lineas || b.bullets || [];
    h += '<div class="fila' + (i === S.cur ? ' act' : '') + '"><div class="fila-top"><b>' + esc(b.n) + '</b><span class="t">' + (b.ini / 60) + '–' + (b.fin / 60) + ' min</span>' +
      (b.libro ? '<span class="chip">Libro ' + esc(b.libro) + '</span>' : '') +
      (b.diapos ? '<span class="chip dia">Diapositivas ' + esc(b.diapos) + '</span>' : '') + '</div><ul>';
    items.forEach(function (t) { h += '<li>' + esc(t) + '</li>'; });
    h += '</ul>' + (b.tablero ? '<h4>Al tablero</h4><p>' + esc(b.tablero) + '</p>' : '') + '</div>';
  });
  if (M.ojo.length) h += ojoHtml();
  $('lista').innerHTML = h;
}
function renderMods() {
  var h = '';
  MODULOS.forEach(function (m, i) {
    h += '<button type="button" class="mod-btn' + (i === idx ? ' act' : '') + '" data-i="' + i + '"><span class="id">' + esc(m.id) + '</span><span class="tt">' + esc(m.titulo) + '</span><span class="min">' + m.minutos + ' min</span></button>';
  });
  $('mods').innerHTML = h;
}
$('mods').addEventListener('click', function (e) { var b = e.target.closest('.mod-btn'); if (b) { abrir(parseInt(b.getAttribute('data-i'), 10)); ver('escena'); } });
$('mod').addEventListener('change', function () { abrir(parseInt($('mod').value, 10)); });

function ver(v) {
  ['escena', 'guion', 'mods'].forEach(function (x) {
    $('v-' + x).classList.toggle('on', x === v);
    $('tab-' + x).setAttribute('aria-pressed', x === v ? 'true' : 'false');
  });
  window.scrollTo(0, 0);
}
$('tab-escena').addEventListener('click', function () { ver('escena'); });
$('tab-guion').addEventListener('click', function () { renderGuion(); ver('guion'); });
$('tab-mods').addEventListener('click', function () { renderMods(); ver('mods'); });

function arrancar() {
  document.body.classList.remove('bloqueado');
  var sel = $('mod');
  MODULOS.forEach(function (m, i) { var o = document.createElement('option'); o.value = String(i); o.textContent = m.id + ' · ' + m.titulo; sel.appendChild(o); });
  var ini = 0; try { ini = parseInt(localStorage.getItem(KEYBASE + 'ultimo') || '0', 10) || 0; } catch (e) {}
  if (ini < 0 || ini >= MODULOS.length) ini = 0;
  abrir(ini);
}

/* Si el contenido viene cifrado, se pide la clave y se descifra aquí, en el navegador */
function b64(t) { return Uint8Array.from(atob(t), function (c) { return c.charCodeAt(0); }); }
async function descifrar(clave) {
  var raw = b64(CIF), sal = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28), enc = new TextEncoder();
  var base = await crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveKey']);
  var k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sal, iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  var plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, k, ct);
  return JSON.parse(new TextDecoder().decode(plano));
}
async function abrirConClave(clave, recordar) {
  try {
    MODULOS = await descifrar(clave);
  } catch (e) { return false; }
  if (recordar) { try { localStorage.setItem('guia-clave', clave); } catch (e2) {} }
  arrancar(); return true;
}
if (MODULOS) arrancar();
else {
  document.body.classList.add('bloqueado');
  var guardada = ''; try { guardada = localStorage.getItem('guia-clave') || ''; } catch (e) {}
  if (guardada) abrirConClave(guardada, false).then(function (ok) { if (!ok) try { localStorage.removeItem('guia-clave'); } catch (e) {} });
  $('form-clave').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var c = $('clave').value;
    abrirConClave(c, true).then(function (ok) { $('clave-msg').textContent = ok ? '' : 'Esa clave no abre la guía. Revísala e intenta de nuevo.'; });
  });
}
</script>
