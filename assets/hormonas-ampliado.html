<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hormonas y sobrepeso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600&display=swap">
<style>
:root { --verde-profundo:#173F33; --verde-bosque:#1F5142; --verde-claro:#E4EDE7; --crema:#F7F1E5; --crema-claro:#FFF9EE; --mostaza:#E4AA18; --tinta:#15261F;
  --bg:var(--crema); --card:var(--crema-claro); --fg:var(--tinta); --fg2:#43554C; --head:var(--verde-profundo); --linea:#D5D9CC; --th:var(--verde-claro);
  --display:"Fraunces",Georgia,serif; --texto:"Archivo","Segoe UI",system-ui,sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0E1713; --card:#172821; --fg:#F1EFE3; --fg2:#B3C1B8; --head:#E4EDE7; --linea:#2B3F36; --th:#1F3A30; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--texto); font-size:17px; line-height:1.55;
  padding-inline:max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px)); padding-block:36px 70px; }
main { max-width:900px; margin:0 auto; }
h1,h2,h3 { font-family:var(--display); color:var(--head); line-height:1.15; text-wrap:balance; }
h1 { font-size:clamp(1.9rem,1.3rem+2.4vw,2.8rem); margin:0 0 12px; }
h2 { font-size:1.6rem; margin:2.2em 0 .5em; padding-top:.4em; border-top:2px solid var(--mostaza); }
h3 { font-size:1.2rem; margin:1.6em 0 .4em; }
p,li { max-width:75ch; } li { margin:.25em 0; }
blockquote { margin:1em 0; padding:.6em 1em; background:var(--card); border-left:4px solid var(--mostaza); border-radius:0 8px 8px 0; color:var(--fg2); }
blockquote p { margin:.2em 0; max-width:none; }
.tabla { overflow-x:auto; margin:1em 0; border:1px solid var(--linea); border-radius:10px; }
table { border-collapse:collapse; width:100%; min-width:640px; font-size:.93rem; }
th { background:var(--th); color:var(--head); text-align:left; }
th,td { padding:9px 12px; border-bottom:1px solid var(--linea); vertical-align:top; }
a { color:var(--verde-bosque); } @media (prefers-color-scheme: dark) { a { color:#9BAFA4; } }
ol li { font-size:.9rem; }
#candado { max-width:420px; margin:12vh auto; background:var(--card); border:1px solid var(--linea); border-radius:14px; padding:26px; }
#candado input { width:100%; padding:12px; font:inherit; border:1px solid var(--linea); border-radius:8px; background:var(--bg); color:var(--fg); }
#candado button { margin-top:12px; padding:12px 18px; font:inherit; font-weight:600; border:0; border-radius:8px; background:var(--verde-bosque); color:#fff; cursor:pointer; }
#err { color:#b3261e; min-height:1.3em; margin:.6em 0 0; }
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function descifrar(clave) {
  const raw = b64(CIF), sal = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:sal, iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv}, k, ct));
}
async function abrir(clave, guardar) {
  try {
    const h = await descifrar(clave);
    document.getElementById("doc").innerHTML = h;
    if (guardar) { try { localStorage.setItem("guia-clave", clave); } catch (e) {} }
    return true;
  } catch (e) { return false; }
}
document.getElementById("ok").onclick = async () => {
  const ok = await abrir(document.getElementById("k").value.trim(), true);
  if (!ok) document.getElementById("err").textContent = "Esa clave no abre el documento.";
};
document.getElementById("k").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("ok").click(); });
(async () => { let c = null; try { c = localStorage.getItem("guia-clave"); } catch (e) {} if (c) await abrir(c, false); })();
