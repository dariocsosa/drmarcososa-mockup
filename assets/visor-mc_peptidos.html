<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Masterclass · Péptidos: qué son y para qué se usan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600&display=swap">
<style>
:root { --verde-profundo:#173F33; --verde-bosque:#1F5142; --verde-salvia:#9BAFA4; --verde-claro:#E4EDE7; --crema:#F7F1E5; --crema-claro:#FFF9EE; --mostaza:#E4AA18; --tinta:#15261F;
  --bg:var(--crema); --card:var(--crema-claro); --fg:var(--tinta); --fg2:#43554C; --head:var(--verde-profundo); --linea:#D5D9CC; --act:var(--verde-claro); --aviso:#8A5A00; --lienzo:#2b2b2b;
  --display:"Fraunces",Georgia,serif; --texto:"Archivo","Segoe UI",system-ui,sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0E1713; --card:#172821; --fg:#F1EFE3; --fg2:#B3C1B8; --head:#E4EDE7; --linea:#2B3F36; --act:#1F3A30; --aviso:#E4AA18; color-scheme:dark; } }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--texto); font-size:17px; line-height:1.4; display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:10px; padding:10px max(16px, env(safe-area-inset-left,0px)); border-bottom:1px solid var(--linea); flex-wrap:wrap; }
header h1 { font-family:var(--display); color:var(--head); font-size:1.15rem; margin:0; flex:1 1 auto; min-width:0; }
header small { color:var(--fg2); }
button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:10px 16px; background:var(--verde-bosque); color:#fff; cursor:pointer; }
button.sec { background:var(--card); color:var(--fg); border:1px solid var(--linea); }
button:disabled { opacity:.4; cursor:default; }
button:focus-visible, input:focus-visible { outline:3px solid var(--mostaza); outline-offset:2px; }
#cuerpo { flex:1 1 auto; display:flex; min-height:0; }
#indice { width:340px; flex:0 0 auto; overflow:auto; border-right:1px solid var(--linea); padding:12px; background:var(--card); }
#indice input { width:100%; padding:10px; font:inherit; border:1px solid var(--linea); border-radius:8px; background:var(--bg); color:var(--fg); margin-bottom:8px; }
#indice h3 { font-family:var(--display); font-size:.95rem; color:var(--head); margin:14px 0 4px; }
.it { display:grid; grid-template-columns:38px 1fr; gap:6px; width:100%; text-align:left; background:none; color:var(--fg); border:0; border-radius:8px; padding:6px 8px; font-weight:400; font-size:.92rem; }
.it:hover { background:var(--act); }
.it.act { background:var(--act); font-weight:600; box-shadow:inset 3px 0 0 var(--mostaza); }
.it .n { color:var(--fg2); font-variant-numeric:tabular-nums; }
.it.oc .t { opacity:.7; font-style:italic; }
#escena { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; padding:10px max(12px, env(safe-area-inset-right,0px)) 10px 12px; gap:10px; }
#lienzo { flex:1 1 auto; min-height:0; background:var(--lienzo); border-radius:12px; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
#lienzo img { max-width:100%; max-height:100%; object-fit:contain; display:block; background:#fff; }
#oculta { display:none; max-width:640px; padding:28px; text-align:center; color:#F1EFE3; }
#oculta h2 { font-family:var(--display); margin:0 0 8px; }
#oculta p { color:#c9d4cd; margin:6px 0; }
#cargando { position:absolute; color:#c9d4cd; }
#guion { display:none; padding:10px 14px; border:1px solid var(--linea); border-radius:10px; background:var(--card); font-size:1.02rem; }
#guion b { color:var(--fg2); text-transform:uppercase; font-size:.78rem; letter-spacing:.08em; display:block; margin-bottom:2px; }
#nota { display:none; padding:10px 14px; border:1px dashed var(--aviso); border-radius:10px; background:color-mix(in srgb, var(--aviso) 9%, var(--card)); font-size:.98rem; }
#nota b { color:var(--aviso); text-transform:uppercase; font-size:.78rem; letter-spacing:.08em; display:block; margin-bottom:2px; }
#ctrl { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
#ctrl .info { flex:1 1 180px; min-width:0; color:var(--fg2); }
#ctrl .info b { color:var(--fg); font-family:var(--display); font-size:1.05rem; }
#ctrl button.gr { padding:14px 26px; font-size:1.1rem; }
#ir { width:70px; padding:10px; font:inherit; border:1px solid var(--linea); border-radius:8px; background:var(--bg); color:var(--fg); }
#candado { max-width:440px; margin:12vh auto; background:var(--card); border:1px solid var(--linea); border-radius:14px; padding:26px; }
#candado h1 { font-family:var(--display); color:var(--head); font-size:1.5rem; margin:0 0 8px; }
#candado input { width:100%; padding:12px; font:inherit; border:1px solid var(--linea); border-radius:8px; background:var(--bg); color:var(--fg); }
#candado button { margin-top:12px; }
#err { color:#b3261e; min-height:1.3em; }
#app { display:none; flex:1 1 auto; flex-direction:column; min-height:0; }
@media (max-width:820px) { #indice { position:fixed; inset:0 auto 0 0; width:min(340px, 88vw); z-index:5; transform:translateX(-102%); transition:transform .2s; box-shadow:0 0 24px #0006; } body.ver-indice #indice { transform:none; } }
@media (min-width:821px) { body:not(.ver-indice) #indice { display:none; } }
:fullscreen header, :fullscreen #indice, :fullscreen #ctrl .info, :fullscreen #nota { }
</style>
</head>
<body>
<div id="candado"><h1>Masterclass · Péptidos: qué son y para qué se usan</h1><p>Escribe la clave que te dio Darío.</p>
<input id="k" type="password" autocomplete="off" aria-label="Clave"><button id="ok" type="button">Abrir</button><p id="err" role="alert"></p></div>
<div id="app">
<header><button class="sec" id="bind" type="button" aria-label="Mostrar u ocultar el índice">☰ Índice</button><h1 id="tit">Péptidos</h1><button class="sec" id="bruta" type="button" style="display:none">Ruta 90 min</button><small id="prog"></small><button class="sec" id="bfs" type="button">Pantalla completa</button></header>
<div id="cuerpo">
<nav id="indice" aria-label="Índice de diapositivas"><input id="q" type="search" placeholder="Buscar en los títulos" aria-label="Buscar"><div id="lista"></div></nav>
<main id="escena">
<div id="lienzo"><span id="cargando">Cargando…</span><img id="img" alt=""><div id="oculta"><h2 id="oh"></h2><p id="om"></p></div></div>
<div id="guion"><b>Para decir</b><span id="gt"></span></div>
<div id="nota"><b>Ojo con esta diapositiva</b><span id="nt"></span></div>
<div id="ctrl"><button class="sec gr" id="ant" type="button">◂ Anterior</button><button class="gr" id="sig" type="button">Siguiente ▸</button><div class="info"><b id="ntit"></b><br><span id="nsec"></span></div><label for="ir">Ir a</label><input id="ir" type="number" min="1" inputmode="numeric"></div>
</main>
</div>
</div>
<script>
var $ = function (i) { return document.getElementById(i); };
var KEY = null, D = null, idx = 0, urls = {}, cargando = {}, modoRuta = false, orden = [];
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
async function derivar(clave, sal) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sal, iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function abrirArchivo(buf, off) { var raw = new Uint8Array(buf), iv = raw.slice(off, off + 12), ct = raw.slice(off + 12); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, KEY, ct); }
async function entrar(clave, guardar) {
  try {
    var buf = await (await fetch('visor-mc_peptidos/datos.enc')).arrayBuffer();
    KEY = await derivar(clave, new Uint8Array(buf, 0, 16));
    D = JSON.parse(new TextDecoder().decode(await abrirArchivo(buf, 16)));
  } catch (e) { KEY = null; return false; }
  if (guardar) { try { localStorage.setItem('guia-clave', clave); } catch (e) {} }
  $('candado').style.display = 'none'; $('app').style.display = 'flex';
  $('tit').textContent = D.titulo + ' · ' + D.autor;
  if (D.ruta) { $('bruta').style.display = ''; var mr = null; try { mr = localStorage.getItem('visor-mc_peptidos-ruta'); } catch (e) {} modoRuta = mr !== '0'; $('bruta').textContent = modoRuta ? 'Ruta 90 min ✓' : 'Todas las diapositivas'; }
  calcularOrden(); armarIndice(); var n = 0; try { n = parseInt(localStorage.getItem('visor-mc_peptidos-n') || '0', 10); } catch (e) {}
  ir(n >= 0 && n < D.slides.length ? n : 0); return true;
}
function calcularOrden() {
  orden = [];
  if (modoRuta && D.ruta) { D.ruta.forEach(function (r) { r.slides.forEach(function (n) { var i = D.slides.findIndex(function (s) { return s.n === n; }); if (i >= 0) orden.push(i); }); }); }
  else { D.slides.forEach(function (s, i) { orden.push(i); }); }
}
function armarIndice() {
  var h = '';
  if (modoRuta && D.ruta) {
    D.ruta.forEach(function (r) {
      h += '<h3>' + esc(r.nombre) + ' · ' + r.min + ' min</h3>';
      r.slides.forEach(function (n) { var i = D.slides.findIndex(function (s) { return s.n === n; }); var d = D.slides[i]; h += '<button type="button" class="it' + (d.oculta ? ' oc' : '') + '" data-i="' + i + '" data-t="' + esc((d.titulo + ' ' + d.n).toLowerCase()) + '"><span class="n">' + d.n + '</span><span class="t">' + esc(d.titulo) + (d.nota ? ' ⚑' : '') + '</span></button>'; });
    });
    $('lista').innerHTML = h; return;
  }
  D.secciones.forEach(function (s) {
    h += '<h3>' + esc(s.nombre) + '</h3>';
    D.slides.forEach(function (d, i) { if (d.n >= s.desde && d.n <= s.hasta) h += '<button type="button" class="it' + (d.oculta ? ' oc' : '') + '" data-i="' + i + '" data-t="' + esc((d.titulo + ' ' + d.n).toLowerCase()) + '"><span class="n">' + d.n + '</span><span class="t">' + esc(d.titulo) + (d.nota ? ' ⚑' : '') + '</span></button>'; });
  });
  $('lista').innerHTML = h;
}
async function imagen(i) {
  var d = D.slides[i]; if (d.oculta) return null;
  if (urls[i]) return urls[i];
  if (cargando[i]) return cargando[i];
  cargando[i] = (async function () {
    var buf = await (await fetch('visor-mc_peptidos/s' + String(d.n).padStart(3, '0') + '.enc')).arrayBuffer();
    var pt = await abrirArchivo(buf, 0); urls[i] = URL.createObjectURL(new Blob([pt], { type: 'image/jpeg' })); return urls[i];
  })();
  return cargando[i];
}
async function ir(i) {
  if (i < 0 || i >= D.slides.length) return;
  idx = i; var d = D.slides[i];
  try { localStorage.setItem('visor-mc_peptidos-n', String(i)); } catch (e) {}
  $('prog').textContent = d.n + ' de ' + D.slides[D.slides.length - 1].n;
  $('ntit').textContent = d.titulo; var sec = D.secciones.filter(function (s) { return d.n >= s.desde && d.n <= s.hasta; })[0]; $('nsec').textContent = sec ? sec.nombre : ''; if (modoRuta && D.ruta) { var rr = D.ruta.filter(function (r) { return r.slides.indexOf(d.n) >= 0; })[0]; if (rr) $('nsec').textContent = 'Bloque: ' + rr.nombre + ' · ' + rr.min + ' min'; }
  $('ant').disabled = vecino(-1) < 0; $('sig').disabled = vecino(1) < 0; $('ir').value = d.n;
  $('nota').style.display = d.nota ? 'block' : 'none'; $('nt').textContent = d.nota || ''; $('guion').style.display = d.guion ? 'block' : 'none'; $('gt').textContent = d.guion || '';
  Array.prototype.forEach.call(document.querySelectorAll('.it'), function (b) { b.classList.toggle('act', parseInt(b.getAttribute('data-i'), 10) === i); });
  var act = document.querySelector('.it.act'); if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest' });
  if (d.oculta) { $('img').style.display = 'none'; $('oculta').style.display = 'block'; $('oh').textContent = 'Diapositiva ' + d.n + ': ' + d.titulo; $('om').textContent = d.motivo; $('cargando').style.display = 'none'; }
  else {
    $('oculta').style.display = 'none'; $('cargando').style.display = 'block';
    var u = await imagen(i); if (idx !== i) return;
    $('img').src = u; $('img').alt = 'Diapositiva ' + d.n + ': ' + d.titulo; $('img').style.display = 'block'; $('cargando').style.display = 'none';
  }
  [1, 2].forEach(function (k) { if (i + k < D.slides.length) imagen(i + k); });
}
$('ok').onclick = async function () { var ok = await entrar($('k').value.trim(), true); if (!ok) $('err').textContent = 'Esa clave no abre el visor.'; };
$('k').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('ok').click(); });
function vecino(dir) { var n = D.slides[idx].n, p = -1; if (dir > 0) { for (var k = 0; k < orden.length; k++) { if (D.slides[orden[k]].n > n || (orden[k] !== idx && modoRuta && D.slides[orden[k]].n === n)) { p = orden[k]; break; } } } else { for (var k2 = orden.length - 1; k2 >= 0; k2--) { if (D.slides[orden[k2]].n < n) { p = orden[k2]; break; } } } return p; }
$('sig').onclick = function () { var p = vecino(1); if (p >= 0) ir(p); }; $('ant').onclick = function () { var p = vecino(-1); if (p >= 0) ir(p); };
$('ir').addEventListener('change', function () { var n = parseInt($('ir').value, 10), i = D.slides.findIndex(function (s) { return s.n === n; }); if (i >= 0) ir(i); });
$('bruta').onclick = function () { modoRuta = !modoRuta; try { localStorage.setItem('visor-mc_peptidos-ruta', modoRuta ? '1' : '0'); } catch (e) {} $('bruta').textContent = modoRuta ? 'Ruta 90 min ✓' : 'Todas las diapositivas'; calcularOrden(); armarIndice(); ir(idx); };
$('bind').onclick = function () { document.body.classList.toggle('ver-indice'); };
$('lista').addEventListener('click', function (e) { var b = e.target.closest('.it'); if (!b) return; ir(parseInt(b.getAttribute('data-i'), 10)); if (window.innerWidth <= 820) document.body.classList.remove('ver-indice'); });
$('q').addEventListener('input', function () { var q = $('q').value.trim().toLowerCase(); Array.prototype.forEach.call(document.querySelectorAll('.it'), function (b) { b.style.display = !q || b.getAttribute('data-t').indexOf(q) >= 0 ? '' : 'none'; }); });
$('bfs').onclick = function () { var el = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen().catch(function () {}); };
document.addEventListener('keydown', function (e) {
  if (!D || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); $('sig').click(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); $('ant').click(); }
  else if (e.key === 'Home') ir(0); else if (e.key === 'End') ir(D.slides.length - 1);
  else if (e.key === 'f' || e.key === 'F') $('bfs').click();
});
(async function () { var c = null; try { c = localStorage.getItem('guia-clave'); } catch (e) {} if (c) await entrar(c, false); })();
</script>
</body>
</html>
